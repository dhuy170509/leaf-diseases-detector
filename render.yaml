services:
  - type: web
    name: agriai-node
    env: node
    plan: free
    buildCommand: npm --prefix server install --include=dev && npm --prefix server run build
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
