<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn đoán bệnh lá</title>
    <style>
        :root {
            --bg: #0b1021;
            --panel: #11172f;
            --accent: #3ac172;
            --muted: #8aa0c2;
            --text: #e9f0ff;
            --danger: #ff5f6d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(58, 193, 114, 0.08), transparent 30%),
                radial-gradient(circle at 80% 0%, rgba(90, 134, 255, 0.1), transparent 30%),
                linear-gradient(145deg, #0c1328, #070a18 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .card {
            width: min(960px, 100%);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(58, 193, 114, 0.06), rgba(90, 134, 255, 0.08));
            pointer-events: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 4px;
            font-size: 14px;
        }

        form {
            margin-top: 24px;
            padding: 18px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            display: grid;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        label {
            font-weight: 600;
        }

        input[type="file"] {
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            background: linear-gradient(120deg, #34d399, #22c55e);
            border: none;
            color: #041018;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .status {
            margin-top: 8px;
            font-size: 14px;
            color: var(--muted);
            min-height: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
            position: relative;
            z-index: 1;
        }

        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
        }

        .panel h3 {
            margin: 0 0 10px;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        .preview {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #0c1226;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }

        .label {
            color: var(--muted);
            font-size: 14px;
        }

        .value {
            font-weight: 700;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .pill.danger {
            background: rgba(255, 95, 109, 0.12);
            color: #ffc7cd;
            border-color: rgba(255, 95, 109, 0.4);
        }

        .pill.safe {
            background: rgba(52, 211, 153, 0.12);
            color: #c7f4df;
            border-color: rgba(52, 211, 153, 0.35);
        }

        ul {
            padding-left: 18px;
            color: var(--text);
        }

        li {
            margin-bottom: 6px;
            line-height: 1.45;
        }

        .muted {
            color: var(--muted);
        }

        @media (max-width: 780px) {
            body {
                padding: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <div>
                <div class="title">Hệ thống chẩn đoán bệnh lá</div>
                <div class="subtitle">Tải ảnh lá cây, hệ thống sẽ nhận diện bệnh và gợi ý xử lý</div>
            </div>
            <div class="pill">Model: wambugu71/crop_leaf_diseases_vit</div>
        </div>

        <form id="uploadForm">
            <label for="file">Ảnh lá (rõ nét, không mờ):</label>
            <input id="file" name="file" type="file" accept="image/*" required />
            <button type="submit">Chẩn đoán ngay</button>
            <div id="status" class="status"></div>
        </form>

        <div class="grid">
            <div class="panel">
                <h3>Kết quả</h3>
                <div class="row">
                    <div class="label">Cây trồng</div>
                    <div class="value" id="crop">-</div>
                </div>
                <div class="row">
                    <div class="label">Bệnh</div>
                    <div class="value" id="disease">-</div>
                </div>
                <div class="row">
                    <div class="label">Độ tin cậy</div>
                    <div class="value" id="confidence">-</div>
                </div>
                <div class="row">
                    <div class="label">Mức độ</div>
                    <div class="value" id="severity">-</div>
                </div>
                <div class="row">
                    <div class="label">Trạng thái</div>
                    <div class="value" id="statusBadge">-</div>
                </div>
                <div style="margin: 14px 0;">
                    <div class="label">Thuốc/Hoạt chất khuyến nghị</div>
                    <div id="chemicals" class="muted">-</div>
                </div>
                <div>
                    <div class="label">Hướng dẫn xử lý</div>
                    <ul id="treatmentList">
                        <li class="muted">-</li>
                    </ul>
                </div>
                <div style="margin-top: 10px;">
                    <div class="label">Phòng ngừa</div>
                    <ul id="preventionList">
                        <li class="muted">-</li>
                    </ul>
                </div>
            </div>

            <div class="panel">
                <h3>Ảnh xem trước</h3>
                <div class="preview" id="preview">
                    <span class="muted">Chưa có ảnh</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file');
        const statusEl = document.getElementById('status');
        const previewEl = document.getElementById('preview');
        const cropEl = document.getElementById('crop');
        const diseaseEl = document.getElementById('disease');
        const confEl = document.getElementById('confidence');
        const severityEl = document.getElementById('severity');
        const statusBadgeEl = document.getElementById('statusBadge');
        const treatmentList = document.getElementById('treatmentList');
        const preventionList = document.getElementById('preventionList');
        const chemicalsEl = document.getElementById('chemicals');

        function setStatus(message, tone = 'info') {
            statusEl.textContent = message || '';
            statusEl.style.color = tone === 'error' ? '#ff9aa2' : '#8aa0c2';
        }

        function setPreview(file) {
            previewEl.innerHTML = '';
            const img = document.createElement('img');
            img.alt = 'Ảnh lá';
            img.src = URL.createObjectURL(file);
            previewEl.appendChild(img);
        }

        function renderList(el, items) {
            el.innerHTML = '';
            if (!items || items.length === 0) {
                const li = document.createElement('li');
                li.className = 'muted';
                li.textContent = '-';
                el.appendChild(li);
                return;
            }
            items.forEach((text) => {
                const li = document.createElement('li');
                li.textContent = text;
                el.appendChild(li);
            });
        }

        function renderResult(data) {
            cropEl.textContent = data.crop || '-';
            diseaseEl.textContent = data.disease || '-';
            confEl.textContent = typeof data.confidence === 'number' ? `${(data.confidence * 100).toFixed(1)}%` : '-';
            severityEl.textContent = data.severity || '-';
            statusBadgeEl.textContent = data.uncertain ? 'Không chắc chắn' : 'Đã nhận diện';
            statusBadgeEl.className = 'pill ' + (data.uncertain ? 'danger' : 'safe');
            chemicalsEl.textContent = (data.chemical_suggestions && data.chemical_suggestions.length)
                ? data.chemical_suggestions.join(', ')
                : '-';
            renderList(treatmentList, data.treatment);
            renderList(preventionList, data.prevention);
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (file) setPreview(file);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files?.[0];
            if (!file) {
                setStatus('Vui lòng chọn ảnh.', 'error');
                return;
            }
            setPreview(file);
            setStatus('Đang chẩn đoán...', 'info');

            const fd = new FormData();
            fd.append('file', file);

            try {
                const res = await fetch('/predict', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) {
                    setStatus(data.error || 'Không thể chẩn đoán.', 'error');
                    renderResult({});
                    return;
                }
                setStatus(data.message || 'Hoàn tất.', 'info');
                renderResult(data);
            } catch (err) {
                setStatus('Lỗi kết nối máy chủ.', 'error');
                renderResult({});
            }
        });
    </script>
</body>

</html>
