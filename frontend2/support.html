<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Support • LeafGuard</title>
    <link rel="stylesheet" href="/static/frontend2/style.css">
    <script>try{var t=localStorage.getItem('lg-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module">
        import { toast, animateIn, registerReveal, initBottomNav, initFloatingChat } from '/static/frontend2/app.js';
        window.addEventListener('DOMContentLoaded', () => {
            bind();
            animateIn('.card');
            registerReveal('.card');
            initBottomNav();
            initFloatingChat({ title: 'LeafGuard AI Chat', apiEndpoint: '/api/chat', allowClientKey: false });
        });

        function bind() {
            document.getElementById('contactForm').onsubmit = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = { type: 'contact', ...Object.fromEntries(fd.entries()) };
                await sendContact(payload, e.target, 'Đã gửi liên hệ');
            };
            document.getElementById('feedbackForm').onsubmit = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = { type: 'feedback', message: fd.get('message'), rating: fd.get('rating') };
                await sendContact(payload, e.target, 'Cảm ơn phản hồi');
            };

            const chatForm = document.getElementById('chatForm');
            chatForm.onsubmit = async (e) => {
                e.preventDefault();
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text) return;
                pushMsg('user', text);
                input.value = '';
                pushMsg('bot', 'Đang hỏi AI...');
                try {
                    const r = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error || 'Chat API lỗi');
                    const suffix = d.source && d.source !== 'openai' ? ` (${d.source})` : '';
                    replaceLastBot((d.message || 'Không có trả lời') + suffix);
                } catch (err) {
                    replaceLastBot(`Không gọi được AI: ${err.message}`);
                }
            };
        }

        async function sendContact(payload, form, okMsg) {
            try {
                const r = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (!r.ok || !d.success) throw new Error(d.error || 'Lỗi gửi');
                toast(okMsg); form.reset();
            } catch (err) {
                toast(err.message);
            }
        }

        function pushMsg(who, text) {
            const box = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${who}`;
            div.textContent = text;
            box.append(div);
            box.scrollTop = box.scrollHeight;
        }

        function replaceLastBot(text) {
            const box = document.getElementById('chatMessages');
            const bots = box.querySelectorAll('.msg.bot');
            const last = bots[bots.length - 1];
            if (last) last.textContent = text;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</head>

<body>
    <div class="navbar">
        <div><strong>LeafGuard</strong></div>
        <div class="nav-links">
            <a href="/frontend2/index.html">Trang chủ</a>
            <a href="/frontend2/predict.html">Dự đoán</a>
            <a href="/frontend2/disease.html">Thư viện bệnh</a>
            <a href="/frontend2/support.html">Hỗ trợ</a>
            <a href="/frontend2/admin.html">Quản trị</a>
        </div>
    </div>
    <div class="main" style="padding-top:90px;">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px,1fr));">
            <div class="card">
                <h3>Liên hệ</h3>
                <form id="contactForm" class="grid">
                    <div class="form-floating"><input name="name" class="input" placeholder=" " />
                        <label>Tên</label></div>
                    <div class="form-floating"><input name="email" type="email" class="input" placeholder=" " />
                        <label>Email</label></div>
                    <div class="form-floating"><textarea name="message" class="input" rows="3" placeholder=" "
                            required></textarea><label>Nội dung</label></div>
                    <button class="btn">Gửi</button>
                </form>
            </div>
            <div class="card">
                <h3>Góp ý</h3>
                <form id="feedbackForm" class="grid">
                    <div class="form-floating"><textarea name="message" class="input" rows="3" placeholder=" "
                            required></textarea><label>Góp ý</label></div>
                    <div class="form-floating"><input name="rating" type="number" min="1" max="5" class="input"
                            placeholder=" "><label>Đánh giá 1-5</label></div>
                    <button class="btn">Gửi feedback</button>
                </form>
            </div>
            <div class="card">
                <h3>Chatbot hỗ trợ</h3>
                <div class="chatbox">
                    <div id="chatMessages" class="chat-messages">
                        <div class="msg bot">Xin chào! Hỏi mình về cách dùng LeafGuard nhé.</div>
                    </div>
                    <form id="chatForm" class="chat-input">
                        <input id="chatInput" class="input" placeholder="Nhập câu hỏi...">
                        <button class="btn" type="submit">Gửi</button>
                    </form>
                    <p class="muted" style="margin:0; font-size:13px;">Trả lời bởi API /api/chat (cần OPENAI_API_KEY
                        trên server, nếu không sẽ trả lời dự phòng có ghi rõ nguồn).</p>
                </div>
            </div>
        </div>
    </div>
    <div class="toast"></div>
</body>

</html>
